# 三平台矩阵构建：Windows / Ubuntu 22.04 / macOS（universal：arm64 + x86_64）
#
# 触发：push tag v*（发布）、手动 workflow_dispatch
# 产物：msi + nsis、deb + AppImage、dmg —— 各自作为 artifact 上传
#
# 说明：
#  - 前端是纯静态的（web/），没有 beforeBuildCommand，npm 只用来提供 @tauri-apps/cli；
#  - 仓库可能还没有 package-lock.json，所以依赖安装步骤做了 npm ci / npm install 兜底；
#  - bundle 图标需要 src-tauri/icons/，缺了会在打包阶段失败（见 docs/build.md）；
#  - macOS 若不签名/公证，产物会被 Gatekeeper 拦，正式分发请补 APPLE_* secrets。

name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows：msi + nsis（tauri.conf.json 里 NSIS 为 currentUser 安装）
          - platform: windows-latest
            label: Windows (x64)
            target: ''
            rust_targets: ''
            bundles: ''
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

          # Linux：deb + AppImage
          - platform: ubuntu-22.04
            label: Linux (x64)
            target: ''
            rust_targets: ''
            bundles: ''
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

          # macOS：一个 runner 出通用二进制（arm64 + x86_64 合并成同一份 .dmg）
          # 想拆成两个独立产物时，改成两行：
          #   platform: macos-14  target: aarch64-apple-darwin  rust_targets: aarch64-apple-darwin
          #   platform: macos-13  target: x86_64-apple-darwin   rust_targets: x86_64-apple-darwin
          # （注意 Intel runner 标签会随 GitHub 退役，用前先确认仍可用）
          - platform: macos-14
            label: macOS (universal)
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: dmg
            artifacts: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- Linux
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ------------------------------------------------------------- toolchain
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 不启用 npm 缓存：setup-node 的 npm 缓存需要一个已提交的 package-lock.json

      - name: Install Rust (host target)
        if: matrix.rust_targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust (extra targets)
        if: matrix.rust_targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ------------------------------------------------------------- frontend
      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::notice::没有 package-lock.json，回退到 npm install"
            npm install
          fi

      # ---------------------------------------------------------------- build
      - name: Build Tauri app
        shell: bash
        run: |
          set -eo pipefail
          opts=""
          if [ -n "${{ matrix.target }}" ]; then
            opts="$opts --target ${{ matrix.target }}"
          fi
          if [ -n "${{ matrix.bundles }}" ]; then
            opts="$opts --bundles ${{ matrix.bundles }}"
          fi
          echo "npm run tauri build --$opts"
          npm run tauri build -- $opts

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: patchouli-helper-${{ matrix.platform }}-${{ matrix.target || 'native' }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 30

      # 可选：tag 构建时把产物挂到 GitHub Release 上。用 tauri-apps/tauri-action
      # 可以一并完成 build + upload + release，替掉最后两步：
      #
      #   - uses: tauri-apps/tauri-action@v0
      #     env:
      #       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     with:
      #       tagName: ${{ github.ref_name }}
      #       releaseName: Patchouli Helper ${{ github.ref_name }}
      #       args: --target ${{ matrix.target }}
