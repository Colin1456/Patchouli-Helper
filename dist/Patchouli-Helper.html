    <style>
/* ============================================================================
   Patchouli Helper — application shell styling
   ========================================================================== */

:root {
  --bg: #14111c;
  --bg-2: #191524;
  --panel: #1d1828;
  --panel-2: #241d33;
  --panel-3: #2c2440;
  --line: #332a47;
  --line-2: #443a5c;
  --text: #ece9f6;
  --muted: #a49bc0;
  --faint: #7b7295;
  --accent: #b98cff;
  --accent-2: #8b5cf6;
  --accent-soft: rgba(185, 140, 255, 0.14);
  --ok: #5ad19a;
  --warn: #f0b45f;
  --err: #ff6b81;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.22);
  --shadow-2: 0 12px 40px rgba(0, 0, 0, 0.45);
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-book: "Iowan Old Style", "Palatino Linotype", Georgia, "Songti SC", "SimSun", serif;
  --font-mono: "Cascadia Code", "JetBrains Mono", Consolas, "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  background: radial-gradient(1200px 700px at 12% -10%, #241a3a 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 0%, #1c1630 0%, transparent 55%), var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13.5px;
  line-height: 1.5;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3a3050; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: #4b3f66; background-clip: padding-box; }

#app {
  --topbar-h: 56px;
  display: grid;
  grid-template-rows: var(--topbar-h) 1fr 26px;
  height: 100vh;
  overflow: hidden;
}

/* ---------------------------------------------------------------- top bar */

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: linear-gradient(180deg, rgba(38, 30, 56, 0.92), rgba(24, 20, 33, 0.92));
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
  z-index: 20;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
}
.topbar::-webkit-scrollbar { display: none; }
.topbar > * { flex: none; }

.brand { display: flex; align-items: center; gap: 10px; min-width: 210px; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 9px;
  display: grid; place-items: center;
  font-family: var(--font-book); font-weight: 700; font-size: 19px; color: #21182f;
  background: linear-gradient(145deg, #d7b7ff, #9a6ef0 60%, #6d43c9);
  box-shadow: 0 3px 12px rgba(139, 92, 246, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: 14px; letter-spacing: 0.2px; }
.brand-text span { font-size: 11px; color: var(--faint); }

.topbar-group { display: flex; align-items: center; gap: 6px; }
.spacer { flex: 1; }

/* ---------------------------------------------------------------- buttons */

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 11px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-2);
  background: linear-gradient(180deg, #2c2440, #251e35);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.14s ease, border-color 0.14s ease, transform 0.08s ease;
}
.btn:hover { background: linear-gradient(180deg, #362c4d, #2a2240); border-color: #574a75; }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); border-color: transparent; }
.btn.primary {
  background: linear-gradient(180deg, #a880f7, #7c4ddb);
  border-color: #9575e6;
  color: #fff;
  box-shadow: 0 4px 14px rgba(124, 77, 219, 0.35);
}
.btn.primary:hover { background: linear-gradient(180deg, #b894ff, #8a5cf0); }
.btn.tiny { height: 24px; padding: 0 8px; font-size: 12px; }
.btn.danger { color: #ffc3cb; border-color: #6c3444; background: #38202a; }
.btn.danger:hover { background: #4a2733; }
.btn:disabled { opacity: 0.42; cursor: not-allowed; }
.btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.icon-btn {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border-radius: 6px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer;
  font-size: 14px; line-height: 1;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }

.badge {
  display: inline-grid; place-items: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px;
  background: var(--panel-3); color: var(--muted);
  font-size: 11px; font-weight: 600;
}
.badge.err { background: rgba(255, 107, 129, 0.18); color: #ff9aa8; }
.badge.warn { background: rgba(240, 180, 95, 0.16); color: #f4c684; }
.badge.ok { background: rgba(90, 209, 154, 0.15); color: #7ee0af; }

/* ---------------------------------------------------------------- dropdown */

.dropdown { position: relative; }
.dropdown-menu {
  position: absolute; right: 0; top: 36px;
  min-width: 240px; padding: 6px;
  background: var(--panel-2);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  box-shadow: var(--shadow-2);
  display: none;
  z-index: 60;
}
.dropdown.open .dropdown-menu { display: block; }
.dropdown-menu button {
  display: block; width: 100%; text-align: left;
  padding: 8px 10px; border: 0; border-radius: 6px;
  background: transparent; color: var(--text); cursor: pointer; font-size: 13px;
}
.dropdown-menu button:hover { background: var(--accent-soft); }
.dropdown-menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }

/* ---------------------------------------------------------------- language switch */

.lang-switch { display: flex; gap: 4px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
.lang-switch button {
  border: 0; background: transparent; color: var(--muted);
  padding: 4px 9px; border-radius: 6px; cursor: pointer; font-size: 12px;
  display: inline-flex; align-items: center; gap: 5px;
}
.lang-switch button.active { background: var(--accent-soft); color: var(--accent); }
.lang-switch button .dotmark { width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
.lang-switch button.translated .dotmark { background: var(--ok); }

/* ---------------------------------------------------------------- layout */

.layout {
  --sidebar-w: clamp(150px, 20vw, 272px);
  --preview-w: clamp(180px, 46%, 780px);
  /* 兜底：不支持 grid 的渲染器（老内核 / 受限 WebView）用 flex 也保持横向三栏 */
  display: flex;
  flex-wrap: nowrap;
  align-items: stretch;
  min-height: 0;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-x: contain;
}
@supports (display: grid) {
  .layout {
    display: grid;
    /* 始终横向三栏：窗口再窄也只是等比收窄，绝不换行、绝不堆叠 */
    grid-template-columns: var(--sidebar-w) 5px minmax(0, 1fr) 5px var(--preview-w);
  }
  .layout > .sidebar { flex: 0 0 var(--sidebar-w); }
}
.layout > .sidebar { width: var(--sidebar-w); flex: 0 0 auto; }
.layout > .editor { flex: 1 1 auto; }
.layout > .preview { flex: 0 0 var(--preview-w); }
.layout > .splitter { flex: 0 0 5px; }
.layout > * { min-width: 0; }
.layout::-webkit-scrollbar { height: 8px; }
.layout::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }

/* draggable column dividers */
.splitter {
  position: relative;
  cursor: col-resize;
  background: transparent;
  touch-action: none;
  user-select: none;
}
.splitter::before {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  left: 1px;
  width: 1px;
  background: var(--line);
  transition: background 0.15s ease;
}
.splitter::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: 3px;
  height: 38px;
  border-radius: 3px;
  background: var(--line-2);
  transform: translate(-50%, -50%);
  transition: background 0.15s ease, height 0.15s ease;
}
.splitter:hover::before { background: var(--line-2); }
.splitter:hover::after { background: var(--accent); height: 56px; }
.splitter.dragging::before { background: var(--accent); }
.splitter.dragging::after { background: var(--accent); }
body.col-resizing { cursor: col-resize; }
body.col-resizing * { user-select: none; }

.sidebar {
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(30, 24, 42, 0.9), rgba(23, 19, 32, 0.9));
  border-right: 1px solid var(--line);
  min-height: 0;
}
.side-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 8px;
  font-size: 11px; letter-spacing: 0.9px; text-transform: uppercase; color: var(--faint);
}
.side-head .hint { text-transform: none; letter-spacing: 0; }
.tree { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
.side-foot {
  display: flex; gap: 6px; padding: 10px;
  border-top: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.14);
}
.side-foot .btn { flex: 1; justify-content: center; }

.tree-book {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; margin-bottom: 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: linear-gradient(180deg, #2a2140, #221b33);
  cursor: pointer;
}
.tree-book:hover { border-color: var(--line-2); }
.tree-book.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft) inset; }
.tree-book .book-cover { width: 22px; height: 28px; border-radius: 3px; display: grid; place-items: center; font-size: 12px; color: #fff8; background: linear-gradient(160deg, #6d3f2c, #45251a); border: 1px solid #8a5c40; }
.tree-book .meta { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.tree-book .meta strong { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-book .meta span { font-size: 10.5px; color: var(--faint); }

.tree-group { margin: 10px 0 2px; padding: 0 8px; font-size: 10.5px; letter-spacing: 0.8px; color: var(--faint); text-transform: uppercase; display: flex; justify-content: space-between; }

.tree-node {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 6px 8px; border-radius: 7px; cursor: pointer;
  border: 1px solid transparent; position: relative;
}
.tree-node:hover { background: rgba(255, 255, 255, 0.045); }
.tree-node.selected { background: var(--accent-soft); border-color: rgba(185, 140, 255, 0.4); }
.tree-node .node-icon {
  width: 20px; height: 20px; flex: none; border-radius: 5px;
  display: grid; place-items: center;
  background: var(--panel-3); font-size: 11px; color: var(--muted);
  overflow: hidden;
}
.tree-node .node-icon img { width: 100%; height: 100%; image-rendering: pixelated; }
.tree-node .node-body { min-width: 0; flex: 1; }
.tree-node .node-title { display: flex; align-items: center; gap: 5px; font-size: 12.5px; }
.tree-node .node-title span.label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-node .node-sub { font-size: 10.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-node.tree-category .node-title { font-weight: 600; }
.tree-entry { margin-left: 14px; }
.tree-children { position: relative; }
.tree-children::before { content: ''; position: absolute; left: 7px; top: 2px; bottom: 6px; width: 1px; background: var(--line); }
.tree-empty { padding: 10px; font-size: 12px; color: var(--faint); text-align: center; }
.missing-tag { font-size: 9.5px; padding: 1px 5px; border-radius: 4px; background: rgba(255, 107, 129, 0.16); color: #ff9aa8; }

/* ---------------------------------------------------------------- editor */

.editor { overflow-y: auto; padding: 18px 20px 90px; min-height: 0; }
.editor-inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.empty-state { height: 100%; display: grid; place-content: center; justify-items: center; gap: 4px; color: var(--faint); text-align: center; }
.empty-state .empty-emoji { font-size: 44px; opacity: 0.75; }
.empty-state h2 { margin: 6px 0 0; font-size: 16px; color: var(--muted); font-weight: 600; }
.empty-state p { margin: 0; font-size: 12.5px; }

.card {
  background: linear-gradient(180deg, rgba(41, 33, 58, 0.72), rgba(30, 24, 43, 0.72));
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-1);
  overflow: hidden;
}
.card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.02);
}
.card-head h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
.card-head .sub { color: var(--faint); font-size: 11.5px; }
.card-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.card-body.tight { padding: 10px 14px; }

.section-title { display: flex; align-items: center; gap: 8px; margin: 2px 0 -2px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.field .req { color: var(--err); }
.field .help { font-size: 11px; color: var(--faint); }

input[type='text'], input[type='number'], textarea, select {
  width: 100%;
  background: #171226;
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  padding: 7px 9px;
  color: var(--text);
  outline: none;
  transition: border-color 0.14s ease, box-shadow 0.14s ease;
}
input[type='text']:focus, input[type='number']:focus, textarea:focus, select:focus {
  border-color: var(--accent-2);
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.16);
}
input.invalid, textarea.invalid { border-color: #7d3543; }
textarea { resize: vertical; min-height: 76px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 14px) 13px, calc(100% - 9px) 13px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
input[type='number'] { -moz-appearance: textfield; }

.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12px; color: var(--muted); }
.switch input { display: none; }
.switch .track { width: 32px; height: 18px; border-radius: 9px; background: #332a47; position: relative; transition: background 0.16s ease; }
.switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #8d84a8; transition: transform 0.16s ease, background 0.16s ease; }
.switch input:checked + .track { background: rgba(185, 140, 255, 0.35); }
.switch input:checked + .track::after { transform: translateX(14px); background: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 999px;
  background: var(--panel-3); border: 1px solid var(--line-2);
  font-size: 11.5px; color: var(--muted);
}
.chip.removable { cursor: pointer; }
.chip.removable:hover { border-color: var(--err); color: #ffb3bd; }
.chip .x { opacity: 0.6; }
.chip.add { cursor: pointer; border-style: dashed; color: var(--faint); }
.chip.add:hover { color: var(--accent); border-color: var(--accent); }

.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 5px; font-size: 10.5px; background: var(--panel-3); color: var(--faint); border: 1px solid var(--line); }
.tag.accent { color: var(--accent); border-color: rgba(185, 140, 255, 0.35); background: var(--accent-soft); }
.tag.warn { color: #f4c684; border-color: rgba(240, 180, 95, 0.3); background: rgba(240, 180, 95, 0.12); }

/* ---------------------------------------------------------------- rich text field */

.rte { border: 1px solid var(--line-2); border-radius: var(--radius-sm); overflow: hidden; background: #171226; }
.rte.focused { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.14); }
.rte-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
  padding: 5px 6px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.025);
}
.rte-toolbar button {
  min-width: 24px; height: 22px; padding: 0 5px;
  border: 1px solid transparent; border-radius: 5px;
  background: transparent; color: var(--muted); cursor: pointer;
  font-size: 11.5px; font-family: var(--font-mono);
}
.rte-toolbar button:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }
.rte-toolbar .sep { width: 1px; height: 16px; background: var(--line); margin: 0 3px; }
.rte-toolbar .color-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #0006; display: block; }
.rte textarea { border: 0; border-radius: 0; background: transparent; min-height: 96px; }
.rte textarea:focus { box-shadow: none; }
.rte-preview {
  border-top: 1px dashed var(--line);
  padding: 8px 10px;
  font-family: var(--font-book);
  font-size: 13px; color: #cfc6e4;
  max-height: 200px; overflow: auto;
}

/* ---------------------------------------------------------------- page cards */

.page-card { border: 1px solid var(--line); border-radius: 10px; background: rgba(23, 18, 34, 0.6); }
.page-card.dragging { opacity: 0.55; }
.page-card-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.02);
  border-radius: 10px 10px 0 0;
}
.page-index { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; background: var(--panel-3); font-size: 10.5px; color: var(--muted); font-family: var(--font-mono); }
.page-card-head select { width: auto; min-width: 190px; padding: 4px 26px 4px 8px; background-position: calc(100% - 14px) 10px, calc(100% - 9px) 10px; font-size: 12px; }
.page-actions { margin-left: auto; display: flex; gap: 3px; }
.page-card-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

.page-list-empty { padding: 22px; text-align: center; color: var(--faint); border: 1px dashed var(--line-2); border-radius: 10px; }

/* ---------------------------------------------------------------- preview */

.preview { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: linear-gradient(180deg, rgba(22, 18, 32, 0.6), rgba(17, 14, 25, 0.85)); }
.preview-head {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.16);
}
.tabs { display: flex; gap: 4px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.tab { border: 0; background: transparent; color: var(--muted); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.tab.active { background: var(--accent-soft); color: var(--accent); }
.preview-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.page-indicator { font-size: 11px; color: var(--faint); font-family: var(--font-mono); min-width: 46px; text-align: center; }
.preview-body { flex: 1; overflow: auto; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }

.book {
  --cover: #6d3f2c;
  --cover-dark: #40231a;
  --paper: #f6e9c9;
  flex: none;
  width: min(700px, 100%);
  aspect-ratio: 1 / 0.72;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  border-radius: 8px;
  padding: 10px;
  background:
    radial-gradient(120% 120% at 50% -10%, rgba(255, 255, 255, 0.28), transparent 45%),
    linear-gradient(150deg, var(--cover), var(--cover-dark));
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), inset 0 0 0 2px rgba(0, 0, 0, 0.35), inset 0 0 40px rgba(0, 0, 0, 0.35);
  position: relative;
  font-family: var(--font-book);
}
.book::before {
  content: '';
  position: absolute; inset: 8px;
  border-radius: 5px;
  box-shadow: inset 0 0 0 1px rgba(255, 226, 170, 0.25);
  pointer-events: none;
}
.book.zoomed { width: 100%; }

.book-page {
  background-color: var(--paper);
  background-image:
    radial-gradient(140% 100% at 8% 0%, rgba(255, 255, 255, 0.7), transparent 42%),
    radial-gradient(120% 90% at 100% 100%, rgba(196, 160, 104, 0.18), transparent 55%),
    repeating-radial-gradient(circle at 30% 20%, rgba(150, 120, 70, 0.045) 0 1px, transparent 1px 3px);
  color: #3b2f22;
  padding: 22px 26px 26px;
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
}
.book-page.left { border-radius: 4px 0 0 4px; box-shadow: inset -18px 0 24px -22px rgba(0, 0, 0, 0.85); }
.book-page.right { border-radius: 0 4px 4px 0; box-shadow: inset 18px 0 24px -22px rgba(0, 0, 0, 0.85); }
.book-page.muted { opacity: 0.55; }
.book-page::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, rgba(120, 90, 50, 0.02) 0 2px, transparent 2px 4px);
  pointer-events: none;
}

.page-title {
  font-family: var(--font-book);
  font-size: 17px; font-weight: 700; color: #4a3520;
  margin: 0 0 8px;
  text-align: center;
  letter-spacing: 0.4px;
}
.page-title::after { content: ''; display: block; width: 46px; height: 1px; margin: 6px auto 0; background: linear-gradient(90deg, transparent, #a98e63, transparent); }
.page-body { font-size: 12.5px; line-height: 1.62; overflow: hidden; flex: 1; }

/* Patchouli rich text inside the book preview */
.rich { word-break: break-word; }
.rich p { margin: 0 0 6px; }
.rich .br { display: block; }
.rich .br2 { display: block; height: 12px; }
.rich ul.list { margin: 2px 0 8px; padding-left: 16px; }
.rich ul.list li { margin: 1px 0; list-style: none; position: relative; }
.rich ul.list li::before { content: '•'; position: absolute; left: -11px; color: #8a6f47; }
.rich .item { color: #2e6b48; font-weight: 600; }
.rich .thing { color: #2c5f96; font-weight: 600; }
.rich .u { text-decoration: underline; text-decoration-thickness: 1px; font-weight: 700; }
.rich .it { font-style: italic; }
.rich .bold { font-weight: 700; }
.rich .mono { font-family: var(--font-mono); font-size: 0.95em; }
.rich a.inlink { color: #7b4cc4; text-decoration: underline; cursor: pointer; border-bottom: 1px dashed rgba(123, 76, 196, 0.4); }
.rich a.inlink:hover { background: rgba(123, 76, 196, 0.1); }
.rich a.ext { color: #2b6bb5; text-decoration: underline; }
.rich .key {
  display: inline-block; padding: 0 4px; border-radius: 3px;
  background: #e6d8b8; border: 1px solid #c4ab7e; font-size: 11px; font-family: var(--font-mono);
}
.rich .tooltip-term { border-bottom: 1px dotted #8a6f47; cursor: help; }
.rich .color { font-weight: 600; }
.rich .macro-missing { color: #b23a3a; background: #f6dada; border-radius: 2px; padding: 0 2px; }

/* Structured preview blocks (recipes, images, entities...) */
.book-block { border: 1px solid #d9c7a0; border-radius: 4px; background: rgba(255, 250, 235, 0.6); padding: 8px; margin: 6px 0; }
.book-block .block-label { font-size: 9.5px; letter-spacing: 0.8px; text-transform: uppercase; color: #9a855f; margin-bottom: 4px; font-family: var(--font-ui); }
.recipe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; width: 96px; }
.recipe-slot { aspect-ratio: 1; border: 1px solid #cbb086; border-radius: 2px; background: #efe1bd; }
.spotlight-item { display: flex; align-items: center; gap: 8px; }
.spotlight-item .slot { width: 34px; height: 34px; border: 1px solid #cbb086; border-radius: 3px; background: #efe1bd; display: grid; place-items: center; }
.image-strip { display: flex; gap: 6px; flex-wrap: wrap; }
.image-strip .ph { width: 108px; height: 62px; border: 1px dashed #c4ab7e; background: #f0e2be; display: grid; place-items: center; font-size: 10px; color: #9a855f; border-radius: 3px; text-align: center; padding: 4px; font-family: var(--font-ui); }
.image-strip img { max-width: 132px; max-height: 80px; border: 1px solid #cbb086; border-radius: 2px; image-rendering: pixelated; }

.index-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.index-entry { display: flex; gap: 8px; align-items: center; padding: 6px; border: 1px solid #dcc9a2; border-radius: 5px; background: rgba(255, 251, 238, 0.6); cursor: pointer; }
.index-entry:hover { border-color: #b99b6c; background: rgba(255, 248, 228, 0.9); }
.index-entry .slot { width: 26px; height: 26px; border: 1px solid #cbb086; border-radius: 3px; background: #efe1bd; display: grid; place-items: center; font-size: 12px; }
.index-entry .name { font-size: 12px; color: #4a3520; }
.index-empty { color: #9a855f; font-size: 12px; text-align: center; padding: 20px 0; }

/* ---------------------------------------------------------------- json view */

.json-view { width: 100%; }
.json-tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.json-file {
  background: #120f1c; border: 1px solid var(--line); border-radius: 8px;
  padding: 10px 12px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.55;
  color: #cfc9e6; overflow: auto; white-space: pre; max-height: 60vh;
}
.json-file .k { color: #b98cff; }
.json-file .s { color: #8fd6a8; }
.json-file .n { color: #f0b45f; }
.json-file .b { color: #7cc7ff; }

/* ---------------------------------------------------------------- status bar */

.statusbar {
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px;
  font-size: 11.5px; color: var(--faint);
  border-top: 1px solid var(--line);
  background: rgba(15, 12, 22, 0.9);
}
.statusbar .dot { opacity: 0.5; }
.statusbar .dirty { color: var(--warn); }
.statusbar .saved { color: var(--ok); }

/* ---------------------------------------------------------------- modal + toast */

#modal-root:empty { display: none; }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(8, 6, 14, 0.62);
  backdrop-filter: blur(3px);
  display: grid; place-items: center;
  padding: 24px;
}
.modal {
  width: min(720px, 100%);
  max-height: 86vh;
  display: flex; flex-direction: column;
  background: var(--panel-2);
  border: 1px solid var(--line-2);
  border-radius: 14px;
  box-shadow: var(--shadow-2);
  overflow: hidden;
  animation: pop 0.16s ease;
}
@keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; font-size: 14px; }
.modal-body { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: rgba(0, 0, 0, 0.15); }

#toast-root { position: fixed; right: 18px; bottom: 40px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast {
  padding: 9px 14px; border-radius: 9px;
  background: #2a2340; border: 1px solid var(--line-2);
  color: var(--text); font-size: 12.5px;
  box-shadow: var(--shadow-2);
  animation: slidein 0.18s ease;
  max-width: 420px;
}
.toast.ok { border-color: rgba(90, 209, 154, 0.4); }
.toast.err { border-color: rgba(255, 107, 129, 0.5); background: #3a2130; }
@keyframes slidein { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ---------------------------------------------------------------- problems list */

.problem-list { display: flex; flex-direction: column; gap: 6px; }
.problem {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 8px 10px; border-radius: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--line);
  font-size: 12px;
  cursor: pointer;
}
.problem:hover { border-color: var(--line-2); }
.problem .sev { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: none; }
.problem.error .sev { background: var(--err); }
.problem.warning .sev { background: var(--warn); }
.problem.info .sev { background: #6ea8fe; }
.problem .where { color: var(--faint); font-size: 11px; }

.kbd { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 4px; border-radius: 3px; background: var(--panel-3); border: 1px solid var(--line-2); color: var(--muted); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.mono { font-family: var(--font-mono); }

/* ---------------------------------------------------------------- additions */

.field-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.field-grid .field.half { max-width: none; }
.field-grid:has(.field.half) { grid-template-columns: 1fr; }
.field-grid .field.half { grid-column: span 1; }
@media (min-width: 900px) {
  .field-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field-grid .field:not(.half) { grid-column: 1 / -1; }
}

.item-tile {
  display: inline-grid; place-items: center;
  border-radius: 4px; color: #f3edff; font-weight: 700;
  border: 1px solid rgba(255,255,255,.14);
  flex: none; letter-spacing: .3px;
}

.entry-row { padding: 5px 4px; border-radius: 6px; }
.entry-row:hover { background: rgba(255,255,255,.04); }
.entry-row .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.asset-list { display: flex; flex-direction: column; gap: 6px; }
.asset-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 7px; background: rgba(255,255,255,.02); }
.asset-thumb { width: 30px; height: 30px; border-radius: 5px; object-fit: contain; background: #12101a; border: 1px solid var(--line-2); image-rendering: pixelated; display: grid; place-items: center; font-size: 11px; color: var(--faint); }
.asset-row .mono { font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }


.rich .li { display: inline-block; width: 1em; color: #8a6f47; }
.rich .li.l2 { margin-left: 4px; }
.rich .strike { text-decoration: line-through; }
.rich .obf { font-style: italic; opacity: .85; letter-spacing: 1px; }
.rich .uline { text-decoration: underline; }
.rich .cmdlink { color: #2b6bb5; text-decoration: underline dotted; cursor: pointer; }

.mb-wrap { display: flex; flex-direction: column; gap: 8px; }
.mb-layer-wrap { display: flex; gap: 8px; align-items: flex-start; }
.mb-layer-label { font-size: 9.5px; color: #9a855f; width: 34px; flex: none; padding-top: 2px; font-family: var(--font-ui); }
.mb-layer { display: flex; flex-direction: column; gap: 2px; }
.mb-row { display: flex; gap: 2px; }
.mb-cell { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,.18); }

.card-head .h3 { min-width: 0; }
.card-head h3 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 340px; }

/* ------------------------------------------------- responsive / small screens */

.layout > .sidebar,
.layout > .editor,
.layout > .preview { min-width: 0; }

@media (max-height: 780px) {
  #app { --topbar-h: 48px; }
  .topbar { gap: 8px; padding: 0 10px; }
  .brand { min-width: 0; }
  .brand-text span { display: none; }
  .preview-body { padding: 10px; }
  .editor { padding: 12px 14px 70px; }
  .card-head { padding: 9px 12px; }
  .card-body { padding: 11px; }
  .statusbar { font-size: 11px; }
  .rte textarea { min-height: 72px; }
}

@media (max-width: 1240px) {
  .topbar .btn { padding: 0 8px; }
  .brand-text strong { font-size: 13px; }
  .lang-switch button { padding: 4px 6px; }
}

@media (max-width: 1000px) {
  .topbar-group .btn { font-size: 12px; }
}

/* keep the book readable when the column is very narrow */
.preview-body { min-width: 0; }

    <div id="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">P</div>
          <div class="brand-text">
            <strong>Patchouli Helper</strong>
            <span id="brand-sub">帕秋莉手册可视化编辑器</span>
          </div>
        </div>

        <div class="topbar-group" id="project-group">
          <button class="btn ghost" data-action="new-project" title="新建书籍工程">新建</button>
          <button class="btn ghost" data-action="open-project" title="从 .phbook 工程文件打开">打开</button>
          <button class="btn ghost" data-action="save-project" title="保存到 .phbook 工程文件">保存</button>
          <button class="btn ghost" data-action="import-book" title="从已有的 Patchouli 书籍目录 / 资源包导入">导入</button>
        </div>

        <div class="spacer"></div>

        <div class="lang-switch" id="lang-switch" title="编辑中的内容语言（导出时每种语言各生成一套 JSON）"></div>

        <div class="topbar-group">
          <button class="btn ghost" data-action="validate" title="检查引用、图标、本地化等完整性问题">
            校验 <span class="badge" id="problem-count">0</span>
          </button>
          <div class="dropdown">
            <button class="btn primary" data-action="toggle-export">导出 ▾</button>
            <div class="dropdown-menu" id="export-menu">
              <button data-action="export-resourcepack">资源包 zip（自动含数据包）…</button>
              <hr />
              <button data-action="export-json">导出当前页 JSON（复制）</button>
              <button data-action="export-snapshot">整书 JSON 打包…</button>
            </div>
          </div>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <div class="side-head">
            <span>书籍结构</span>
            <span class="hint" id="tree-count"></span>
          </div>
          <div class="tree" id="tree"></div>
          <div class="side-foot">
            <button class="btn tiny" data-action="add-category">+ 分类</button>
            <button class="btn tiny" data-action="add-entry">+ 条目</button>
          </div>
        </aside>

        <div class="splitter" data-split="sidebar" title="拖动调整左侧宽度（双击复位）"></div>

        <section class="editor" id="editor">
          <div class="empty-state">
            <div class="empty-emoji">📖</div>
            <h2>从左侧选择一个分类或条目</h2>
            <p>也可以直接点「新建」开始一本新书。</p>
          </div>
        </section>

        <div class="splitter" data-split="preview" title="拖动调整预览宽度（双击复位）"></div>

        <section class="preview" id="preview">
          <div class="preview-head">
            <div class="tabs" id="preview-tabs">
              <button class="tab active" data-preview="book">书页预览</button>
              <button class="tab" data-preview="json">JSON 预览</button>
            </div>
            <div class="preview-tools">
              <button class="icon-btn" data-action="preview-prev" title="上一页">‹</button>
              <span class="page-indicator" id="page-indicator">1 / 1</span>
              <button class="icon-btn" data-action="preview-next" title="下一页">›</button>
              <button class="icon-btn" data-action="preview-zoom" title="缩放">⤢</button>
            </div>
          </div>
          <div class="preview-body" id="preview-body"></div>
        </section>
      </main>

      <footer class="statusbar">
        <span id="status-project">未命名工程</span>
        <span class="dot">·</span>
        <span id="status-profile">Forge 1.20.1</span>
        <span class="dot">·</span>
        <span id="status-dirty">已保存</span>
        <div class="spacer"></div>
        <span id="status-lang">zh_cn</span>
        <span class="dot">·</span>
        <span id="status-counts"></span>
        <span class="dot">·</span>
        <span id="status-build" title="构建时间，用来确认你打开的是最新版本"></span>
        <span class="dot">·</span>
        <span id="status-viewport" title="当前窗口尺寸（CSS 像素）"></span>
      </footer>
