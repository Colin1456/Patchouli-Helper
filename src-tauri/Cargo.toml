[package]
name = "patchouli-helper"
version = "0.1.0"
description = "Visual editor for Patchouli guide books"
authors = ["Colin"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "patchouli_helper_lib"
# Desktop-only build: a plain rlib. The "cdylib"/"staticlib" variant used by the
# Tauri template is only needed for mobile targets and makes GNU ld fail with
# "export ordinal too large" on Windows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
